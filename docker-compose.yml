name: leave-system

services:
  postgres:
    image: postgres:15-alpine
    container_name: leave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-leavedb}
      POSTGRES_USER: ${DB_USER:-leave_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-leave_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-leave_user} -d ${DB_NAME:-leavedb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - leave-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leave-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-leavedb}
      DB_USER: ${DB_USER:-leave_user}
      DB_PASSWORD: ${DB_PASSWORD:-leave_secret}
      CAMUNDA_GRPC_ADDRESS: ${CAMUNDA_GRPC_ADDRESS:-http://host.docker.internal:26500}
      CAMUNDA_REST_ADDRESS: ${CAMUNDA_REST_ADDRESS:-http://host.docker.internal:8080}
      CAMUNDA_USERNAME: ${CAMUNDA_USERNAME:-demo}
      CAMUNDA_PASSWORD: ${CAMUNDA_PASSWORD:-demo}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - leave-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leave-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - leave-network

volumes:
  postgres_data:
    driver: local

networks:
  leave-network:
    driver: bridge
