server:
  port: 8081

spring:
  application:
    name: leave-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: jdbc:h2:file:./data/leavedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

camunda:
  client:
    mode: self-managed
    grpc-address: ${CAMUNDA_GRPC_ADDRESS:http://localhost:26500}
    rest-address: ${CAMUNDA_REST_ADDRESS:http://localhost:8080}
    auth:
      username: ${CAMUNDA_USERNAME:demo}
      password: ${CAMUNDA_PASSWORD:demo}
    zeebe:
      defaults:
        job-worker:
          stream-enabled: false

---
# Docker Profile
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/leavedb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:leave_user}
    password: ${DB_PASSWORD:leave_secret}
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

camunda:
  client:
    mode: self-managed
    grpc-address: ${CAMUNDA_GRPC_ADDRESS:http://host.docker.internal:26500}
    rest-address: ${CAMUNDA_REST_ADDRESS:http://host.docker.internal:8080}
